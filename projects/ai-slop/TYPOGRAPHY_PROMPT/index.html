<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ВУСА — корм для тварин</title>

  <!--
    Font choice:
    Bricolage Grotesque — distinctive display typography.
    Extreme weights: 200 and 900.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200;12..96,900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #15120f;
      --text: #f4ecdf;
      --muted: #aaa094;
      --accent: #ff681f;
      --accent-dark: #c8470f;
      --line: rgba(244, 236, 223, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Bricolage Grotesque", sans-serif;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      background:
        radial-gradient(
          circle at 78% 50%,
          rgba(255, 104, 31, 0.19),
          transparent 24%
        ),
        linear-gradient(
          135deg,
          #15120f 0%,
          #1e1914 100%
        );
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(
          rgba(244, 236, 223, 0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(244, 236, 223, 0.035) 1px,
          transparent 1px
        );
      background-size: 56px 56px;
      mask-image: linear-gradient(
        to right,
        black 0%,
        black 55%,
        transparent 100%
      );
      pointer-events: none;
    }

    .hero__inner {
      position: relative;
      width: min(1320px, calc(100% - 48px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      align-items: center;
      grid-template-columns: 1fr;
      gap: 48px;
      padding: 32px 0;
    }

    .hero__copy {
      position: relative;
      z-index: 2;
    }

    .hero__brand {
      margin: 0 0 80px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.06em;
    }

    .hero__brand span {
      color: var(--accent);
    }

    .hero__label {
      margin: 0 0 20px;
      font-size: 12px;
      font-weight: 200;
      letter-spacing: 0.04em;
    }

    .hero__title {
      max-width: 850px;
      margin: 0;
      font-size: clamp(76px, 18vw, 220px);
      font-weight: 900;
      line-height: 0.76;
      letter-spacing: -0.085em;
    }

    .hero__title span {
      display: block;
      margin-left: 0.22em;
      color: var(--accent);
    }

    .hero__text {
      max-width: 460px;
      margin: 48px 0 0;
      font-size: 18px;
      font-weight: 200;
      line-height: 1.45;
      letter-spacing: -0.015em;
    }

    .hero__button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      margin-top: 38px;
      padding: 0 28px;
      background: var(--accent);
      color: var(--bg);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -0.01em;
      text-decoration: none;
      transition:
        background-color 200ms ease,
        transform 200ms ease;
    }

    .hero__button:hover {
      background: #ff7c3e;
      transform: translateY(-4px);
    }

    .hero__visual {
      position: relative;
      min-height: 430px;
      display: grid;
      place-items: center;
    }

    .hero__shape {
      position: relative;
      width: min(76vw, 460px);
      aspect-ratio: 1;
      border-radius: 42% 58% 55% 45%;
      background: var(--accent);
      transform: rotate(12deg);
      box-shadow:
        35px 40px 0 rgba(255, 104, 31, 0.08);
    }

    .hero__shape::before {
      content: "";
      position: absolute;
      inset: 12%;
      border: 1px solid rgba(21, 18, 15, 0.4);
      border-radius: 48% 52% 42% 58%;
    }

    .hero__shape::after {
      content: "B";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--bg);
      font-size: clamp(120px, 24vw, 260px);
      font-weight: 900;
      line-height: 1;
      transform: rotate(-12deg);
    }

    .hero__side-text {
      position: absolute;
      right: 0;
      bottom: 20px;
      font-size: 11px;
      font-weight: 200;
      line-height: 1.3;
      text-align: right;
      writing-mode: vertical-rl;
      text-transform: uppercase;
    }

    .hero__bottom {
      position: absolute;
      right: 0;
      bottom: 32px;
      left: 0;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 11px;
      font-weight: 200;
    }

    .hero__bottom p {
      margin: 0;
    }

    @media (min-width: 800px) {
      .hero__inner {
        grid-template-columns: 1.1fr 0.9fr;
        gap: 80px;
      }

      .hero__brand {
        margin-bottom: 110px;
      }

      .hero__visual {
        min-height: 600px;
      }

      .hero__shape {
        width: min(40vw, 540px);
      }
    }

    @media (min-width: 1200px) {
      .hero__inner {
        width: min(1440px, calc(100% - 120px));
      }

      .hero__title span {
        margin-left: 0.32em;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .hero__brand,
      .hero__label,
      .hero__title,
      .hero__text,
      .hero__button,
      .hero__visual,
      .hero__bottom {
        opacity: 0;
      }

      .hero__brand {
        animation: reveal 600ms 80ms ease forwards;
      }

      .hero__label {
        animation: reveal 650ms 180ms ease forwards;
      }

      .hero__title {
        animation: reveal 800ms 280ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .hero__text {
        animation: reveal 650ms 420ms ease forwards;
      }

      .hero__button {
        animation: reveal 650ms 520ms ease forwards;
      }

      .hero__visual {
        animation: visual-reveal 900ms 260ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .hero__bottom {
        animation: reveal 650ms 650ms ease forwards;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(28px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes visual-reveal {
        from {
          opacity: 0;
          transform: scale(0.86) rotate(-5deg);
        }

        to {
          opacity: 1;
          transform: scale(1) rotate(0);
        }
      }
    }
  </style>
</head>

<body>
  <main class="hero">
    <div class="hero__inner">

      <section class="hero__copy">
        <p class="hero__brand">
          ВУСА<span>.</span>
        </p>

        <p class="hero__label">
          Корм для собак і котів
        </p>

        <h1 class="hero__title">
          Справжня
          <span>їжа.</span>
        </h1>

        <p class="hero__text">
          Чистий склад. Сильний смак.
          Корм, створений для тварин,
          яким є куди бігти.
        </p>

        <a class="hero__button" href="#">
          Обрати раціон
        </a>
      </section>

      <div class="hero__visual" aria-hidden="true">
        <div class="hero__shape"></div>

        <p class="hero__side-text">
          Real food / Real energy / Real life
        </p>
      </div>

      <footer class="hero__bottom">
        <p>Без зайвого.</p>
        <p>100% уваги до складу.</p>
      </footer>

    </div>
  </main>
</body>
</html>
