<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fitness Studio</title>

  <style>
    .hero {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 100vh;
      padding: 80px 24px;
      overflow: hidden;
      background-color: #141414;
      color: #fff;
    }

    .hero__content {
      position: relative;
      z-index: 2;
      max-width: 700px;
    }

    .hero__eyebrow {
      margin: 0 0 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #ff6b00;
    }

    .hero__title {
      max-width: 650px;
      margin: 0;
      font-size: clamp(56px, 12vw, 140px);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.05em;
      text-transform: uppercase;
    }

    .hero__title span {
      display: block;
      color: #ff6b00;
    }

    .hero__description {
      max-width: 500px;
      margin: 32px 0 0;
      font-size: 17px;
      line-height: 1.6;
      color: #a7a7a7;
    }

    .hero__button {
      display: inline-flex;
      align-items: center;
      gap: 20px;
      margin-top: 36px;
      padding: 16px 24px;
      border: 1px solid #ff6b00;
      background-color: #ff6b00;
      color: #141414;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      transition:
        background-color 0.25s ease,
        color 0.25s ease,
        transform 0.25s ease;
    }

    .hero__button:hover {
      background-color: transparent;
      color: #ff6b00;
      transform: translateY(-3px);
    }

    .hero__visual {
      position: absolute;
      top: 50%;
      right: -180px;
      width: 500px;
      height: 500px;
      transform: translateY(-50%);
    }

    .hero__circle {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(255, 107, 0, 0.35);
      border-radius: 50%;
      box-shadow:
        0 0 0 60px rgba(255, 107, 0, 0.03),
        0 0 0 120px rgba(255, 107, 0, 0.02);
    }

    .hero__line {
      position: absolute;
      top: 50%;
      left: -100px;
      width: 700px;
      height: 2px;
      background-color: #ff6b00;
      transform: rotate(-45deg);
    }

    .hero__number {
      position: absolute;
      right: 110px;
      bottom: 90px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #ff6b00;
    }

    @media (min-width: 768px) {
      .hero {
        padding: 100px 8%;
      }

      .hero__description {
        font-size: 18px;
      }

      .hero__visual {
        right: -80px;
        width: 600px;
        height: 600px;
      }
    }

    @media (min-width: 1200px) {
      .hero {
        padding: 120px 10%;
      }

      .hero__visual {
        right: 5%;
        width: 650px;
        height: 650px;
      }
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="hero__content">

      <p class="hero__eyebrow">
        FITNESS STUDIO
      </p>

      <h1 class="hero__title">
        Стань
        <span>сильнішим.</span>
      </h1>

      <p class="hero__description">
        Тренування, які допомагають перевершити власні межі
        та сформувати тіло, яким ти будеш пишатися.
      </p>

      <a class="hero__button" href="#training">
        Почати тренування
        <span aria-hidden="true">→</span>
      </a>

    </div>

    <div class="hero__visual" aria-hidden="true">
      <div class="hero__circle"></div>
      <div class="hero__line"></div>
      <span class="hero__number">01</span>
    </div>
  </section>

</body>
</html>
