<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Сильніше тіло. Чіткіший фокус. Фітнес-студія для тих, хто не стоїть на місці.">

  <title>FORGE — Fitness Studio</title>

  <style>
    :root {
      --black: #101010;
      --black-soft: #171717;
      --white: #f5f2ed;
      --muted: #9b9995;
      --orange: #ff6a00;
      --orange-soft: rgba(255, 106, 0, 0.14);
      --line: rgba(245, 242, 237, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
    }

    .hero {
      position: relative;
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 85% 20%, var(--orange-soft), transparent 27rem),
        var(--black);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: 0.32;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }

    .hero__mark {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 3;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .hero__mark-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 20px rgba(255, 106, 0, 0.7);
    }

    .hero__content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: min(100%, 1180px);
      min-height: 100svh;
      margin: 0 auto;
      padding: 108px 24px 56px;
    }

    .hero__kicker {
      max-width: 36rem;
      margin: 0 0 18px;
      color: var(--orange);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .hero__title {
      max-width: 900px;
      margin: 0;
      font-size: clamp(4rem, 14vw, 10rem);
      font-weight: 900;
      line-height: 0.82;
      letter-spacing: -0.065em;
      text-transform: uppercase;
    }

    .hero__title-line {
      display: block;
    }

    .hero__title-line--accent {
      color: var(--orange);
    }

    .hero__bottom {
      display: flex;
      flex-direction: column;
      gap: 28px;
      margin-top: 40px;
    }

    .hero__description {
      max-width: 35rem;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    .hero__cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      min-height: 52px;
      padding: 0 26px;
      border: 1px solid var(--orange);
      background: var(--orange);
      color: var(--black);
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 0.01em;
      transition:
        background-color 180ms ease,
        color 180ms ease,
        transform 180ms ease;
    }

    .hero__cta:hover {
      background: transparent;
      color: var(--white);
      transform: translateY(-2px);
    }

    .hero__cta:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 4px;
    }

    .hero__visual {
      position: absolute;
      right: -38vw;
      bottom: -13vw;
      width: 88vw;
      aspect-ratio: 1;
      z-index: -1;
      border: 1px solid rgba(255, 106, 0, 0.45);
      border-radius: 50%;
      box-shadow:
        0 0 0 9vw rgba(255, 106, 0, 0.035),
        0 0 0 18vw rgba(255, 106, 0, 0.018);
    }

    .hero__visual::before,
    .hero__visual::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 125%;
      height: 3px;
      background: var(--orange);
      transform-origin: center;
      box-shadow: 0 0 30px rgba(255, 106, 0, 0.3);
    }

    .hero__visual::before {
      top: 47%;
      transform: translate(-50%, -50%) rotate(-29deg);
    }

    .hero__visual::after {
      top: 58%;
      transform: translate(-50%, -50%) rotate(-29deg);
      opacity: 0.18;
    }

    .hero__pulse {
      position: absolute;
      top: 18%;
      right: 26%;
      width: 74px;
      height: 74px;
      border: 1px solid rgba(255, 106, 0, 0.7);
      border-radius: 50%;
      background: rgba(16, 16, 16, 0.35);
      box-shadow: 0 0 50px rgba(255, 106, 0, 0.16);
    }

    .hero__pulse::after {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background: var(--orange);
    }

    .hero__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-top: auto;
      padding-top: 56px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .hero__footer span:last-child {
      color: var(--white);
    }

    @media (min-width: 700px) {
      .hero__mark {
        top: 34px;
        left: 42px;
      }

      .hero__content {
        padding: 132px 42px 42px;
      }

      .hero__bottom {
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between;
        gap: 48px;
        margin-top: 54px;
      }

      .hero__description {
        font-size: 18px;
      }

      .hero__visual {
        right: -17vw;
        bottom: -28vw;
        width: 62vw;
      }
    }

    @media (min-width: 1100px) {
      .hero__content {
        padding-inline: 64px;
      }

      .hero__visual {
        right: -8vw;
        bottom: -27vw;
        width: 58vw;
      }

      .hero__pulse {
        top: 20%;
        right: 25%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .hero__cta {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__mark" aria-label="Forge Fitness Studio">
        <span class="hero__mark-dot" aria-hidden="true"></span>
        FORGE
      </div>

      <div class="hero__content">
        <p class="hero__kicker">Твій темп. Твоя сила. Твоя форма.</p>

        <h1 class="hero__title" id="hero-title">
          <span class="hero__title-line">Вийди</span>
          <span class="hero__title-line">за</span>
          <span class="hero__title-line hero__title-line--accent">межі</span>
        </h1>

        <div class="hero__bottom">
          <p class="hero__description">
            Функціональні тренування для тих, хто хоче бути сильнішим
            не на словах, а в кожному русі.
          </p>

          <a class="hero__cta" href="#training">
            Записатися на тренування
          </a>
        </div>

        <div class="hero__footer" aria-hidden="true">
          <span>Функціональна сила · мобільність · витривалість</span>
          <span>Київ · щодня 07:00–22:00</span>
        </div>
      </div>

      <div class="hero__visual" aria-hidden="true">
        <div class="hero__pulse"></div>
      </div>
    </section>
  </main>
</body>
</html>
